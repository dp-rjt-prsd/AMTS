<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Asset Management
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">
            AMS
        </div>

        <div class="sidebar-user">

            <div id="sidebarUserName">
                User
            </div>

            <small id="sidebarUserRole">
                Employee
            </small>

        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="assets.html"
                class="active"
            >
                Assets
            </a>

            <a href="transfers.html">
                Transfers
            </a>

            <a href="repairs.html">
                Repairs
            </a>

            <a
                href="users.html"
                class="admin-only"
            >
                Users
            </a>

            <a
                href="#"
                class="logout"
                onclick="logout()"
            >
                Logout
            </a>

        </nav>

    </aside>

    <!-- MAIN -->

    <div class="main-area">

        <header class="topbar">

            <div
                class="menu-toggle"
                onclick="toggleSidebar()"
            >
                ☰
            </div>

            <h2>
                Asset Management
            </h2>

            <button
                onclick="loadAssets()"
            >
                Refresh
            </button>

        </header>

        <main class="page-content">

            <h1 class="page-title">
                Assets
            </h1>

            <!-- CREATE ASSET -->

            <section class="asset-form">

                <h2>
                    Create Asset
                </h2>

                <form id="assetForm">

                    <input
                        type="text"
                        id="asset_id"
                        placeholder="Asset ID"
                        required
                    >

                    <input
                        type="text"
                        id="asset_name"
                        placeholder="Asset Name"
                        required
                    >

                    <input
                        type="text"
                        id="serial_number"
                        placeholder="Serial Number"
                    >

                    <input
                        type="number"
                        id="price"
                        placeholder="Price"
                    >

                    <input
                        type="text"
                        id="procurement_by"
                        placeholder="Procured By"
                    >

                    <input
                        type="text"
                        id="purchase_order_id"
                        placeholder="Purchase Order ID"
                    >

                    <select
                        id="asset_type_id"
                        required
                    >

                        <option value="">
                            Select Asset Type
                        </option>

                    </select>

                    <select
                        id="status_id"
                        required
                    >

                        <option value="">
                            Select Status
                        </option>

                    </select>

                    <select
                        id="current_holder_id"
                    >

                        <option value="">
                            No Holder
                        </option>

                    </select>

                    <textarea
                        id="remarks"
                        placeholder="Remarks"
                    ></textarea>

                    <button
                        type="submit"
                    >
                        Create Asset
                    </button>

                </form>

            </section>

            <!-- SEARCH -->

            <div class="toolbar">

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search Asset ID or Name..."
                >

            </div>

            <!-- ASSETS TABLE -->

            <section>

                <div class="table-wrapper">

                    <table>

                        <thead>

                        <tr>

                            <th>
                                Asset ID
                            </th>

                            <th>
                                Asset Name
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Holder
                            </th>

                            <th>
                                Serial Number
                            </th>

                            <th>
                                Price
                            </th>

                        </tr>

                        </thead>

                        <tbody
                            id="assetTable"
                        >

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</div>

<script src="js/utils.js"></script>
<script src="js/assets.js"></script>

</body>

</html>
