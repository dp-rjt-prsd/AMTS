<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - AMTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <noscript>
        <div class="noscript-banner">
            This application requires JavaScript. Please enable it in your browser settings,
            then reload this page.
        </div>
    </noscript>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">AMTS</div>

            <div class="sidebar-user">
                <div id="sidebarUserName">User</div>
                <small id="sidebarUserRole">Employee</small>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
                <button type="button" class="logout" onclick="logout()">Logout</button>
            </nav>
        </aside>

        <div class="main-area">

            <header class="topbar">
                <button
                    type="button"
                    class="menu-toggle"
                    data-sidebar-toggle
                    aria-controls="sidebar"
                    aria-expanded="false"
                    aria-label="Toggle navigation menu"
                    onclick="toggleSidebar()"
                >☰</button>

                <h2>User Management</h2>

                <button type="button" onclick="loadUsers()">Refresh</button>
            </header>

            <main class="page-content" id="main-content">

                <h1 class="page-title">Users</h1>

                <section class="asset-form">

                    <h2>Create User</h2>

                    <!-- The only place accounts are created; the endpoint requires an admin. -->
                    <form id="userForm" novalidate>

                        <div class="field">
                            <label for="emp_id">Employee ID <span aria-hidden="true">*</span></label>
                            <input type="text" id="emp_id" required>
                        </div>

                        <div class="field">
                            <label for="name">Full Name <span aria-hidden="true">*</span></label>
                            <input type="text" id="name" required>
                        </div>

                        <div class="field">
                            <label for="email">Email <span aria-hidden="true">*</span></label>
                            <input type="email" id="email" autocomplete="off" required>
                        </div>

                        <div class="field">
                            <label for="password">
                                Password <span aria-hidden="true">*</span>
                            </label>
                            <input
                                type="password"
                                id="password"
                                minlength="8"
                                autocomplete="new-password"
                                aria-describedby="passwordHelp"
                                required
                            >
                            <small id="passwordHelp" class="field-help">At least 8 characters.</small>
                        </div>

                        <div class="field">
                            <label for="role">Role <span aria-hidden="true">*</span></label>
                            <select id="role" required>
                                <option value="EMPLOYEE">Employee</option>
                                <option value="DEPARTMENT_HEAD">Department Head</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="dept_id">Department</label>
                            <!-- Populated from GET /departments. -->
                            <select id="dept_id">
                                <option value="">No department</option>
                            </select>
                        </div>

                        <button type="submit">Create User</button>

                    </form>

                </section>

                <div class="toolbar">
                    <label for="searchBox" class="visually-hidden">Search users</label>
                    <input type="search" id="searchBox" placeholder="Search by name, employee ID or email...">
                </div>

                <section>
                    <h2>User Directory</h2>

                    <div class="table-wrapper">
                        <table class="responsive-table">
                            <caption class="visually-hidden">All user accounts</caption>
                            <thead>
                                <tr>
                                    <th scope="col">User ID</th>
                                    <th scope="col">Employee ID</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Department</th>
                                    <th scope="col">Created</th>
                                </tr>
                            </thead>
                            <tbody id="userTable"></tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/users.js"></script>

</body>

</html>
