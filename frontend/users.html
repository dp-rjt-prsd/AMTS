<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <h2>Asset Management System</h2>

    <div>

        <button onclick="window.location.href='dashboard.html'">
            Dashboard
        </button>

        <button onclick="window.location.href='assets.html'">
            Assets
        </button>

        <button onclick="window.location.href='transfers.html'">
            Transfers
        </button>

        <button onclick="window.location.href='repairs.html'">
            Repairs
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</header>

<main>

    <h1>User Management</h1>

    <section class="asset-form">

        <h2>Create User</h2>

        <form id="userForm">

            <input
                type="text"
                id="emp_id"
                placeholder="Employee ID"
                required
            >

            <input
                type="text"
                id="name"
                placeholder="Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <select id="role">

                <option value="EMPLOYEE">
                    Employee
                </option>

                <option value="ADMIN">
                    Admin
                </option>

            </select>

            <input
                type="number"
                id="dept_id"
                placeholder="Department ID"
                required
            >

            <button type="submit">
                Create User
            </button>

        </form>

    </section>

    <section>

        <div class="toolbar">

            <input
                type="text"
                id="searchBox"
                placeholder="Search User..."
            >

            <button onclick="loadUsers()">
                Refresh
            </button>

        </div>

        <table>

            <thead>

            <tr>

                <th>User ID</th>

                <th>Emp ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Role</th>

                <th>Department</th>

                <th>Created</th>

            </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </section>

</main>

<script src="js/users.js"></script>

</body>
</html>
