<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Management</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">
            AMTS
        </div>

        <div class="sidebar-user">

            <div id="sidebarUserName">
                User
            </div>

            <small id="sidebarUserRole">
                Employee
            </small>

        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="assets.html">
                Assets
            </a>

            <a href="transfers.html">
                Transfers
            </a>

            <a href="repairs.html">
                Repairs
            </a>

            <a href="qr_scan.html">
                QR Scanner
            </a>

            <a
                href="users.html"
                class="active"
            >
                Users
            </a>

            <a
                href="#"
                class="logout"
                onclick="logout()"
            >
                Logout
            </a>

        </nav>

    </aside>

    <!-- MAIN -->

    <div class="main-area">

        <header class="topbar">

            <div
                class="menu-toggle"
                onclick="toggleSidebar()"
            >
                ☰
            </div>

            <h2>
                User Management
            </h2>

            <button
                onclick="loadUsers()"
            >
                Refresh
            </button>

        </header>

        <main class="page-content">

            <h1 class="page-title">
                Users
            </h1>

            <!-- CREATE USER -->

            <section class="asset-form">

                <h2>
                    Create User
                </h2>

                <form id="userForm">

                    <input
                        type="text"
                        id="emp_id"
                        placeholder="Employee ID"
                        required
                    >

                    <input
                        type="text"
                        id="name"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <select
                        id="role"
                        required
                    >

                        <option value="EMPLOYEE">
                            Employee
                        </option>

                        <option value="DEPARTMENT_HEAD">
                            Department Head
                        </option>

                        <option value="ADMIN">
                            Admin
                        </option>

                    </select>

                    <select
                        id="dept_id"
                        required
                    >
                        <option value="" disabled selected>Select Department</option>
                        <option value="1">Department 1</option>
                        <option value="2">Department 2</option>
                        <option value="3">Department 3</option>
                        <option value="4">Department 4</option>
                        <option value="5">Department 5</option>
                        <option value="6">Department 6</option>
                        <option value="7">Department 7</option>
                        <option value="8">Department 8</option>
                    </select>

                    <button
                        type="submit"
                    >
                        Create User
                    </button>

                </form>

            </section>

            <!-- SEARCH -->

            <div class="toolbar">

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search User..."
                >

            </div>

            <!-- USER TABLE -->

            <section>

                <h2
                    style="margin-bottom:16px;"
                >
                    User Directory
                </h2>

                <div class="table-wrapper">

                    <table>

                        <thead>

                        <tr>

                            <th>
                                User ID
                            </th>

                            <th>
                                Employee ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Department
                            </th>

                            <th>
                                Created
                            </th>

                        </tr>

                        </thead>

                        <tbody
                            id="userTable"
                        >

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</div>

<script src="js/utils.js"></script>
<script>requireAdmin();</script>
<script src="js/users.js"></script>

</body>

</html>
