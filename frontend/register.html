<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register - Asset Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-page">

    <div class="login-container" style="max-width: 500px;">

        <h1>
            Create Account
        </h1>

        <p
            style="
                text-align:center;
                color:var(--muted);
                margin-bottom:24px;
            "
        >
            Register to get started
        </p>

        <form id="registerForm">

            <div>

                <label
                    for="emp_id"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Employee ID
                </label>

                <input
                    type="text"
                    id="emp_id"
                    placeholder="e.g., EMP001"
                    required
                    minlength="3"
                    maxlength="50"
                >

            </div>

            <div style="margin-top:16px;">

                <label
                    for="name"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    minlength="2"
                    maxlength="100"
                >

            </div>

            <div style="margin-top:16px;">

                <label
                    for="email"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div style="margin-top:16px;">

                <label
                    for="password"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    required
                    minlength="8"
                    maxlength="100"
                >

                <small
                    style="
                        display:block;
                        margin-top:6px;
                        color:var(--muted);
                    "
                >
                    Must be at least 8 characters
                </small>

            </div>

            <div style="margin-top:16px;">

                <label
                    for="role"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Role
                </label>

                <select
                    id="role"
                    required
                    style="
                        width: 100%;
                        padding: 10px;
                        border-radius: 4px;
                        border: 1px solid var(--border-color);
                        background-color: var(--bg-secondary);
                        color: var(--text-primary);
                        font-size: 14px;
                        cursor: pointer;
                    "
                >
                    <option value="NORMAL_USER">Normal User</option>
                    <option value="DEPARTMENT_HEAD">Department Head</option>
                    <!-- Admin role requires manual setup -->
                </select>

            </div>

            <button
                type="submit"
                style="
                    width:100%;
                    margin-top:24px;
                "
            >
                Create Account
            </button>

        </form>

        <p
            style="
                text-align:center;
                margin-top:16px;
                font-size:14px;
            "
        >
            Already have an account?
            <a
                href="login.html"
                style="
                    color: var(--accent);
                    text-decoration:none;
                    font-weight:500;
                "
            >
                Sign In
            </a>
        </p>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
