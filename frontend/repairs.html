<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repairs - AMTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <noscript>
        <div class="noscript-banner">
            This application requires JavaScript. Please enable it in your browser settings,
            then reload this page.
        </div>
    </noscript>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">AMTS</div>

            <div class="sidebar-user">
                <div id="sidebarUserName">User</div>
                <small id="sidebarUserRole">Employee</small>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
                <button type="button" class="logout" onclick="logout()">Logout</button>
            </nav>
        </aside>

        <div class="main-area">

            <header class="topbar">
                <button
                    type="button"
                    class="menu-toggle"
                    data-sidebar-toggle
                    aria-controls="sidebar"
                    aria-expanded="false"
                    aria-label="Toggle navigation menu"
                    onclick="toggleSidebar()"
                >☰</button>

                <h2>Repairs</h2>

                <button type="button" onclick="loadRepairLogs()">Refresh</button>
            </header>

            <main class="page-content" id="main-content">

                <h1 class="page-title">Repair Management</h1>

                <div class="form-row admin-only">

                    <section class="asset-form">
                        <h2>Send for Repair</h2>

                        <form id="repairForm" novalidate>
                            <div class="field">
                                <label for="repair_asset_id">Asset ID <span aria-hidden="true">*</span></label>
                                <input type="text" id="repair_asset_id" placeholder="AST-0001" required>
                            </div>

                            <div class="field field-wide">
                                <label for="issue_description">
                                    Issue Description <span aria-hidden="true">*</span>
                                </label>
                                <textarea id="issue_description" rows="2" maxlength="500" required></textarea>
                            </div>

                            <button type="submit">Send for Repair</button>
                        </form>
                    </section>

                    <section class="asset-form">
                        <h2>Return from Repair</h2>

                        <form id="returnRepairForm" novalidate>
                            <div class="field">
                                <label for="repair_id">Repair ID <span aria-hidden="true">*</span></label>
                                <input type="number" id="repair_id" min="1" required>
                            </div>

                            <button type="submit">Mark as Returned</button>
                        </form>
                    </section>

                </div>

                <div class="toolbar">
                    <label for="searchBox" class="visually-hidden">Search repairs</label>
                    <input type="search" id="searchBox" placeholder="Search by asset, repair ID or issue...">
                </div>

                <section>
                    <div class="table-wrapper">
                        <table class="responsive-table">
                            <caption class="visually-hidden">Repair history</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Repair ID</th>
                                    <th scope="col">Asset</th>
                                    <th scope="col">Issue</th>
                                    <th scope="col">Sent</th>
                                    <th scope="col">Returned</th>
                                </tr>
                            </thead>
                            <tbody id="repairTable"></tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/repairs.js"></script>

</body>

</html>
