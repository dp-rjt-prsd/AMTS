<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Asset Details</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header class="navbar">

    <h2>Asset Management System</h2>

    <div>

        <button onclick="window.location.href='dashboard.html'">
            Dashboard
        </button>

        <button onclick="window.location.href='assets.html'">
            Assets
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</header>

<main>

    <h1>Asset Details</h1>

    <!-- ASSET INFO -->

    <section class="card">

        <h2>Asset Information</h2>

        <table>

            <tbody>

            <tr>
                <td>Asset ID</td>
                <td id="assetId"></td>
            </tr>

            <tr>
                <td>Asset Name</td>
                <td id="assetName"></td>
            </tr>

            <tr>
                <td>Status</td>
                <td id="assetStatus"></td>
            </tr>

            <tr>
                <td>Current Holder</td>
                <td id="currentHolder"></td>
            </tr>

            <tr>
                <td>Serial Number</td>
                <td id="serialNumber"></td>
            </tr>

            <tr>
                <td>Price</td>
                <td id="price"></td>
            </tr>

            <tr>
                <td>Remarks</td>
                <td id="remarks"></td>
            </tr>

            </tbody>

        </table>

    </section>

    <br>

    <!-- TRANSFER HISTORY -->

    <section>

        <h2>Transfer History</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>From</th>
                <th>To</th>
                <th>Remarks</th>
                <th>Date</th>

            </tr>

            </thead>

            <tbody id="transferHistory">

            </tbody>

        </table>

    </section>

    <br>

    <!-- REPAIR HISTORY -->

    <section>

        <h2>Repair History</h2>

        <table>

            <thead>

            <tr>

                <th>Repair ID</th>
                <th>Issue</th>
                <th>Sent</th>
                <th>Returned</th>

            </tr>

            </thead>

            <tbody id="repairHistory">

            </tbody>

        </table>

    </section>

</main>

<script src="js/asset_details.js"></script>

</body>

</html>
