<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Asset Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="login-page">

    <div class="login-container">

        <h1>
            Asset Management System
        </h1>

        <p
            style="
                text-align:center;
                color:var(--muted);
                margin-bottom:24px;
            "
        >
            Sign in to continue
        </p>

        <form id="loginForm">

            <div>

                <label
                    for="email"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div
                style="margin-top:16px;"
            >

                <label
                    for="password"
                    style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:500;
                    "
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                style="
                    width:100%;
                    margin-top:24px;
                "
            >
                Sign In
            </button>

        </form>

        <p
            style="
                text-align:center;
                margin-top:16px;
                font-size:14px;
            "
        >
            Don't have an account?
            <a
                href="register.html"
                style="
                    color: var(--accent);
                    text-decoration:none;
                    font-weight:500;
                "
            >
                Register here
            </a>
        </p>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
