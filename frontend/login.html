<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Asset Management &amp; Tracking System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <noscript>
        <div class="noscript-banner">
            This application requires JavaScript. Please enable it in your browser settings,
            then reload this page.
        </div>
    </noscript>

    <main class="login-container">

        <h1>Asset Management &amp; Tracking System</h1>

        <p class="login-subtitle">Sign in to continue</p>

        <!-- role="alert" so the failure is announced, not just shown -->
        <p id="loginError" class="form-error" role="alert" hidden></p>

        <form id="loginForm" novalidate>

            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="username"
                    placeholder="you@example.gov"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn-block">Sign In</button>

        </form>

        <!-- Accounts are created by an administrator on the Users page. -->
        <p class="login-footnote">
            Need an account? Contact your system administrator.
        </p>

    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
