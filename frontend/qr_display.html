<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset QR Code - AMTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <noscript>
        <div class="noscript-banner">
            This application requires JavaScript. Please enable it in your browser settings,
            then reload this page.
        </div>
    </noscript>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">AMTS</div>

            <div class="sidebar-user">
                <div id="sidebarUserName">User</div>
                <small id="sidebarUserRole">Employee</small>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
                <button type="button" class="logout" onclick="logout()">Logout</button>
            </nav>
        </aside>

        <div class="main-area">

            <header class="topbar">
                <button
                    type="button"
                    class="menu-toggle"
                    data-sidebar-toggle
                    aria-controls="sidebar"
                    aria-expanded="false"
                    aria-label="Toggle navigation menu"
                    onclick="toggleSidebar()"
                >☰</button>

                <h2>Asset QR Code</h2>
            </header>

            <main class="page-content" id="main-content">

                <div class="qr-container">

                    <h1>Asset QR Code</h1>

                    <p id="loadingState" class="loading-state" role="status" aria-live="polite">
                        Loading asset details...
                    </p>

                    <div id="qrContent" hidden>

                        <div class="qr-display">
                            <img id="qrImage" class="qr-image" src="" alt="">
                        </div>

                        <dl class="detail-grid">
                            <div>
                                <dt>Asset ID</dt>
                                <dd id="assetId">-</dd>
                            </div>
                            <div>
                                <dt>Asset Name</dt>
                                <dd id="assetName">-</dd>
                            </div>
                            <div>
                                <dt>Asset Type</dt>
                                <dd id="assetType">-</dd>
                            </div>
                            <div>
                                <dt>Status</dt>
                                <dd id="assetStatus">-</dd>
                            </div>
                        </dl>

                        <div class="modal-actions">
                            <button type="button" id="printBtn" class="btn btn-print">Print QR</button>
                            <button type="button" class="btn btn-cancel" onclick="goBack()">Back</button>
                        </div>

                    </div>

                    <div id="errorState" hidden>
                        <p class="form-error" id="errorMessage" role="alert"></p>
                        <button type="button" class="btn btn-cancel" onclick="goBack()">
                            Back to Assets
                        </button>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/qr_display.js"></script>

</body>

</html>
