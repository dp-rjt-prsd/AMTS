<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Asset QR Code - AMTS</title>
        <link rel="stylesheet" href="css/style.css" />
        <style>
            .qr-container {
                max-width: 600px;
                margin: 40px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .qr-display {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 30px;
                border: 2px solid #ddd;
                border-radius: 8px;
                background: #fafafa;
            }

            .qr-image {
                max-width: 400px;
                width: 100%;
                height: auto;
                background: white;
                padding: 20px;
                border-radius: 4px;
            }

            .asset-details {
                width: 100%;
                background: #f0f8ff;
                padding: 20px;
                border-radius: 4px;
                border-left: 4px solid #007bff;
            }

            .detail-row {
                display: flex;
                justify-content: space-between;
                margin: 10px 0;
                font-size: 14px;
            }

            .detail-label {
                font-weight: 500;
                color: #666;
            }

            .detail-value {
                color: #333;
            }

            .action-buttons {
                display: flex;
                gap: 10px;
                width: 100%;
                justify-content: center;
            }

            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: 0.3s;
            }

            .btn-print {
                background: #007bff;
                color: white;
            }

            .btn-print:hover {
                background: #0056b3;
            }

            .btn-back {
                background: #6c757d;
                color: white;
            }

            .btn-back:hover {
                background: #5a6268;
            }

            .btn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: #666;
            }

            .error-message {
                padding: 15px;
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                border-radius: 4px;
                margin-bottom: 20px;
            }

            @media print {
                .sidebar,
                .content {
                    width: 100%;
                    margin: 0;
                }

                .action-buttons {
                    display: none;
                }

                .qr-container {
                    max-width: 100%;
                    box-shadow: none;
                }

                body {
                    background: white;
                    padding: 0;
                }
            }
        </style>
    </head>

    <body>
        <script>requireAuth();</script>

        <div class="sidebar">
            <h2>AMTS</h2>
            <div id="userInfo"></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
            </nav>
            <button id="logoutBtn" onclick="logout()">Logout</button>
        </div>

        <div class="content">
            <div class="qr-container">
                <h1>Asset QR Code</h1>

                <div id="loadingState" class="loading">
                    Loading asset details...
                </div>

                <div id="qrContent" style="display: none">
                    <div class="qr-display">
                        <img id="qrImage" class="qr-image" alt="QR Code" />

                        <div class="asset-details">
                            <div class="detail-row">
                                <span class="detail-label">Asset ID:</span>
                                <span class="detail-value" id="assetId"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Asset Name:</span>
                                <span class="detail-value" id="assetName"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Asset Type:</span>
                                <span class="detail-value" id="assetType"></span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="detail-value" id="assetStatus"></span>
                            </div>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button
                            class="btn btn-print"
                            onclick="printQR()"
                        >
                            🖨️ Print QR
                        </button>
                        <button
                            class="btn btn-back"
                            onclick="goBack()"
                        >
                            Back
                        </button>
                    </div>
                </div>

                <div id="errorState" style="display: none">
                    <div class="error-message" id="errorMessage"></div>
                    <button class="btn btn-back" onclick="goBack()">
                        Back to Assets
                    </button>
                </div>
            </div>
        </div>

        <script src="js/utils.js"></script>
        <script src="js/qr_display.js"></script>
    </body>
</html>
