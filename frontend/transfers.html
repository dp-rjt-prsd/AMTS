<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfers - AMTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <noscript>
        <div class="noscript-banner">
            This application requires JavaScript. Please enable it in your browser settings,
            then reload this page.
        </div>
    </noscript>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">AMTS</div>

            <div class="sidebar-user">
                <div id="sidebarUserName">User</div>
                <small id="sidebarUserRole">Employee</small>
            </div>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
                <button type="button" class="logout" onclick="logout()">Logout</button>
            </nav>
        </aside>

        <div class="main-area">

            <header class="topbar">
                <button
                    type="button"
                    class="menu-toggle"
                    data-sidebar-toggle
                    aria-controls="sidebar"
                    aria-expanded="false"
                    aria-label="Toggle navigation menu"
                    onclick="toggleSidebar()"
                >☰</button>

                <h2>Transfers</h2>

                <button type="button" onclick="loadTransfers()">Refresh</button>
            </header>

            <main class="page-content" id="main-content">

                <h1 class="page-title">Asset Transfers</h1>

                <section class="asset-form admin-only">

                    <h2>Transfer an Asset</h2>

                    <form id="transferForm" novalidate>

                        <div class="field">
                            <label for="asset_id">Asset ID <span aria-hidden="true">*</span></label>
                            <input type="text" id="asset_id" placeholder="AST-0001" required>
                        </div>

                        <div class="field">
                            <label for="to_user_id">Transfer To <span aria-hidden="true">*</span></label>
                            <select id="to_user_id" required>
                                <option value="">Select a recipient</option>
                            </select>
                        </div>

                        <div class="field field-wide">
                            <label for="remarks">Remarks</label>
                            <textarea id="remarks" rows="2" maxlength="500"></textarea>
                        </div>

                        <button type="submit">Transfer Asset</button>

                    </form>

                </section>

                <div class="toolbar">
                    <label for="searchBox" class="visually-hidden">Search transfers</label>
                    <input type="search" id="searchBox" placeholder="Search by asset or user...">
                </div>

                <section>
                    <div class="table-wrapper">
                        <table class="responsive-table">
                            <caption class="visually-hidden">Transfer history</caption>
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Asset</th>
                                    <th scope="col">From</th>
                                    <th scope="col">To</th>
                                    <th scope="col">Remarks</th>
                                    <th scope="col">Date</th>
                                </tr>
                            </thead>
                            <tbody id="transferTable"></tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transfers.js"></script>

</body>

</html>
