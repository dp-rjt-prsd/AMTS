<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Asset Transfers
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-header">
            AMS
        </div>

        <div class="sidebar-user">

            <div id="sidebarUserName">
                User
            </div>

            <small id="sidebarUserRole">
                Employee
            </small>

        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="assets.html">
                Assets
            </a>

            <a
                href="transfers.html"
                class="active"
            >
                Transfers
            </a>

            <a href="repairs.html">
                Repairs
            </a>

            <a href="qr_scan.html">
                QR Scanner
            </a>

            <a
                href="users.html"
                class="admin-only"
            >
                Users
            </a>

            <a
                href="#"
                class="logout"
                onclick="logout()"
            >
                Logout
            </a>

        </nav>

    </aside>

    <!-- MAIN -->

    <div class="main-area">

        <header class="topbar">

            <div
                class="menu-toggle"
                onclick="toggleSidebar()"
            >
                ☰
            </div>

            <h2>
                Asset Transfers
            </h2>

            <button
                onclick="loadTransfers()"
            >
                Refresh
            </button>

        </header>

        <main class="page-content">

            <h1 class="page-title">
                Transfer Management
            </h1>

            <!-- TRANSFER FORM -->

            <section class="asset-form">

                <h2>
                    Transfer Asset
                </h2>

                <form id="transferForm">

                    <input
                        type="text"
                        id="asset_id"
                        placeholder="Asset ID"
                        required
                    >

                    <select
                        id="to_user_id"
                        required
                    >

                        <option value="">
                            Select User
                        </option>

                    </select>

                    <textarea
                        id="remarks"
                        placeholder="Transfer Remarks"
                    ></textarea>

                    <button
                        type="submit"
                    >
                        Transfer Asset
                    </button>

                </form>

            </section>

            <!-- SEARCH -->

            <div class="toolbar">

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Search Asset ID..."
                >

            </div>

            <!-- TABLE -->

            <section>

                <div class="table-wrapper">

                    <table>

                        <thead>

                        <tr>

                            <th>
                                Transfer ID
                            </th>

                            <th>
                                Asset ID
                            </th>

                            <th>
                                From User
                            </th>

                            <th>
                                To User
                            </th>

                            <th>
                                Remarks
                            </th>

                            <th>
                                Date
                            </th>

                        </tr>

                        </thead>

                        <tbody
                            id="transferTable"
                        >

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</div>

<script src="js/utils.js"></script>
<script>requireAuth();</script>
<script src="js/transfers.js"></script>

</body>

</html>
