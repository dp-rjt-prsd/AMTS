<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scan QR Code - AMTS</title>
        <link rel="stylesheet" href="css/style.css" />
        <style>
            .scanner-container {
                max-width: 500px;
                margin: 40px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }

            .scanner-content {
                display: flex;
                flex-direction: column;
                gap: 20px;
            }

            #video {
                width: 100%;
                border-radius: 8px;
                border: 2px solid #ddd;
            }

            .scanner-controls {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .control-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .control-group label {
                font-weight: 500;
                font-size: 14px;
                color: #333;
            }

            .control-group input[type="file"] {
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
            }

            #scanBtn {
                padding: 12px;
                background: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                transition: background 0.3s;
            }

            #scanBtn:hover {
                background: #0056b3;
            }

            #scanBtn:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

            .result-box {
                padding: 15px;
                background: #f0f8ff;
                border-left: 4px solid #007bff;
                border-radius: 4px;
                display: none;
            }

            .result-box.success {
                background: #d4edda;
                border-left-color: #28a745;
            }

            .result-box.error {
                background: #f8d7da;
                border-left-color: #dc3545;
            }

            .result-box.show {
                display: block;
            }

            .result-content {
                font-size: 14px;
                line-height: 1.6;
            }

            .result-content strong {
                display: block;
                margin-bottom: 8px;
            }

            .result-detail {
                display: flex;
                justify-content: space-between;
                margin: 4px 0;
            }

            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
            }

            .modal.show {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .modal-content {
                background: white;
                padding: 30px;
                border-radius: 8px;
                text-align: center;
                max-width: 400px;
            }

            .modal-content h2 {
                margin-top: 0;
            }

            .modal-content .asset-info {
                text-align: left;
                background: #f0f8ff;
                padding: 15px;
                border-radius: 4px;
                margin: 15px 0;
            }

            .modal-content .asset-info div {
                margin: 8px 0;
            }

            .modal-content .asset-info .label {
                font-weight: 500;
                color: #666;
            }

            .modal-content .asset-info .value {
                color: #333;
            }

            .modal-actions {
                display: flex;
                gap: 10px;
                margin-top: 20px;
                justify-content: center;
            }

            .btn {
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: 0.3s;
            }

            .btn-confirm {
                background: #28a745;
                color: white;
            }

            .btn-confirm:hover {
                background: #218838;
            }

            .btn-cancel {
                background: #6c757d;
                color: white;
            }

            .btn-cancel:hover {
                background: #5a6268;
            }

            .tab-buttons {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
                border-bottom: 2px solid #ddd;
            }

            .tab-btn {
                padding: 10px 15px;
                background: none;
                border: none;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                color: #666;
                border-bottom: 3px solid transparent;
                margin-bottom: -2px;
                transition: 0.3s;
            }

            .tab-btn.active {
                color: #007bff;
                border-bottom-color: #007bff;
            }

            .tab-content {
                display: none;
            }

            .tab-content.active {
                display: block;
            }

            .success-message {
                padding: 15px;
                background: #d4edda;
                color: #155724;
                border: 1px solid #c3e6cb;
                border-radius: 4px;
                margin-bottom: 20px;
            }

            .error-message {
                padding: 15px;
                background: #f8d7da;
                color: #721c24;
                border: 1px solid #f5c6cb;
                border-radius: 4px;
                margin-bottom: 20px;
            }
        </style>
    </head>

    <body>
        <script>requireAuth();</script>

        <div class="sidebar">
            <h2>AMTS</h2>
            <div id="userInfo"></div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="assets.html">Assets</a>
                <a href="transfers.html">Transfers</a>
                <a href="repairs.html">Repairs</a>
                <a href="qr_scan.html" class="active">QR Scanner</a>
                <a href="users.html" class="admin-only">Users</a>
            </nav>
            <button id="logoutBtn" onclick="logout()">Logout</button>
        </div>

        <div class="content">
            <div class="scanner-container">
                <h1>QR Code Asset Scanner</h1>

                <!-- TABS -->
                <div class="tab-buttons">
                    <button class="tab-btn active" onclick="switchTab('camera')">
                        Camera
                    </button>
                    <button class="tab-btn" onclick="switchTab('upload')">
                        Upload Image
                    </button>
                </div>

                <!-- CAMERA TAB -->
                <div id="camera" class="tab-content active">
                    <div class="scanner-content">
                        <video
                            id="video"
                            width="100%"
                            height="400"
                            style="display: none"
                        ></video>

                        <button id="scanBtn" onclick="startCamera()">
                            📷 Start Camera
                        </button>

                        <div id="cameraResult" class="result-box">
                            <div class="result-content"></div>
                        </div>
                    </div>
                </div>

                <!-- UPLOAD TAB -->
                <div id="upload" class="tab-content">
                    <div class="scanner-content">
                        <div class="control-group">
                            <label>Select Image</label>
                            <input
                                type="file"
                                id="imageInput"
                                accept="image/*"
                            />
                        </div>

                        <canvas
                            id="canvas"
                            style="display: none"
                        ></canvas>

                        <button
                            id="uploadBtn"
                            onclick="uploadImage()"
                            style="
                                padding: 12px;
                                background: #007bff;
                                color: white;
                                border: none;
                                border-radius: 4px;
                                font-size: 16px;
                                cursor: pointer;
                            "
                        >
                            🔍 Scan Image
                        </button>

                        <div id="uploadResult" class="result-box">
                            <div class="result-content"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CONFIRMATION MODAL -->
            <div id="confirmModal" class="modal">
                <div class="modal-content">
                    <h2>Confirm Checkout</h2>
                    <div class="asset-info">
                        <div>
                            <span class="label">Asset ID:</span>
                            <span class="value" id="modalAssetId"></span>
                        </div>
                        <div>
                            <span class="label">Asset Name:</span>
                            <span class="value" id="modalAssetName"></span>
                        </div>
                        <div>
                            <span class="label">
                                Assign to you?
                            </span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button
                            class="btn btn-confirm"
                            onclick="confirmCheckout()"
                        >
                            Confirm
                        </button>
                        <button
                            class="btn btn-cancel"
                            onclick="closeModal()"
                        >
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
        ></script>
        <script src="js/utils.js"></script>
        <script src="js/qr_scanner.js"></script>
    </body>
</html>
