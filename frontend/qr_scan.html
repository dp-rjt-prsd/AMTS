<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Scan QR Code - AMTS</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>

        <div class="app-layout">

            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">AMTS</div>
                <div class="sidebar-user">
                    <div id="sidebarUserName">User</div>
                    <small id="sidebarUserRole">Employee</small>
                </div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="assets.html">Assets</a>
                    <a href="transfers.html">Transfers</a>
                    <a href="repairs.html">Repairs</a>
                    <a href="qr_scan.html" class="active">QR Scanner</a>
                    <a href="users.html" class="admin-only">Users</a>
                    <a href="#" class="logout" onclick="logout()">Logout</a>
                </nav>
            </aside>

            <!-- MAIN -->
            <div class="main-area">

                <header class="topbar">
                    <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
                    <h2>QR Scanner</h2>
                </header>

                <main class="page-content">
                    <div class="qr-container">
                        <h1>QR Code Asset Scanner</h1>

                        <!-- TABS -->
                        <div class="tab-buttons">
                            <button class="tab-btn active" onclick="switchTab('camera')">
                                Camera
                            </button>
                            <button class="tab-btn" onclick="switchTab('upload')">
                                Upload Image
                            </button>
                        </div>

                        <!-- CAMERA TAB -->
                        <div id="camera" class="tab-content active">
                            <div class="scanner-content">
                                <select 
                                    id="cameraSelect" 
                                    style="display: none; padding: 12px; border-radius: 8px; background: var(--surface-card); color: var(--text-primary); border: 1px solid var(--border-color); cursor: pointer;" 
                                    onchange="switchCamera()"
                                >
                                </select>

                                <video
                                    id="video"
                                    width="100%"
                                    height="400"
                                    style="display: none"
                                    autoplay
                                    playsinline
                                    muted
                                ></video>

                                <button id="scanBtn" onclick="startCamera()">
                                    Start Camera
                                </button>

                                <div id="cameraResult" class="result-box">
                                    <div class="result-content"></div>
                                </div>
                            </div>
                        </div>

                        <!-- UPLOAD TAB -->
                        <div id="upload" class="tab-content">
                            <div class="scanner-content">
                                <div class="control-group" style="margin-bottom: 12px;">
                                    <label style="display:block; margin-bottom:8px; color:var(--text-secondary);">Select Image</label>
                                    <input
                                        type="file"
                                        id="imageInput"
                                        accept="image/*"
                                    />
                                </div>

                                <canvas
                                    id="canvas"
                                    style="display: none"
                                ></canvas>

                                <button
                                    id="uploadBtn"
                                    onclick="uploadImage()"
                                >
                                    Scan Image
                                </button>

                                <div id="uploadResult" class="result-box">
                                    <div class="result-content"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CONFIRMATION MODAL -->
                    <div id="confirmModal" class="modal">
                        <div class="modal-content">
                            <h2>Confirm Checkout</h2>
                            <div class="asset-info">
                                <div>
                                    <span class="label">Asset ID:</span>
                                    <span class="value" id="modalAssetId"></span>
                                </div>
                                <div>
                                    <span class="label">Asset Name:</span>
                                    <span class="value" id="modalAssetName"></span>
                                </div>
                                <div>
                                    <span class="label" style="width: 100%; display: block; margin-top: 10px;">
                                        Assign this to you?
                                    </span>
                                </div>
                            </div>
                            <div class="modal-actions">
                                <button
                                    class="btn btn-confirm"
                                    onclick="confirmCheckout()"
                                >
                                    Confirm
                                </button>
                                <button
                                    class="btn btn-cancel"
                                    onclick="closeModal()"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
        <script src="js/utils.js"></script>
        <script>requireAuth();</script>
        <script src="js/qr_scanner.js"></script>
    </body>
</html>
